<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <p id="heading">Expense Tracker</p>

    <div id="summary">

        <div class="c1">
            <p>Income1</p>
            <span>500</span>
        </div>

        <div class="c1">
            <p>Expense2</p>
            <span>200</span>
        </div>

        <div class="c1">
            <p >Balance3</p>
            <span>300</span>
        </div>

    </div>

    <br>

    <input type="text" placeholder="Description">
    <input type="number" step="5" placeholder="Enter Number">
    <input type="text" placeholder="Category (Optional)">

    <br><br>

    <button>Add Expense</button>
    <button>Add Income</button>
    
    <p>Transactions</p>
    <p>No transactions added yet.</p>
    
</body>
</html>
